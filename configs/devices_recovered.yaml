devices:
  - ip: 192.168.239.134
    port: 30003
    username: admin
    password: admin
    device_type: cisco_ios_telnet
    commands:
      config:
        - version 15.7
        - service timestamps debug datetime msec
        - service timestamps log datetime msec
        - no service password-encryption
        - hostname Router
        - boot-start-marker
        - boot-end-marker
        - no aaa new-model
        - mmi polling-interval 60
        - no mmi auto-configure
        - no mmi pvc
        - mmi snmp-timeout 180
        - ip cef
        - no ipv6 cef
        - multilink bundle-name authenticated
        - redundancy
        - interface Ethernet0/0
        - no ip address
        - shutdown
        - duplex auto
        - interface Ethernet0/1
        - no ip address
        - shutdown
        - duplex auto
        - interface Ethernet0/2
        - no ip address
        - shutdown
        - duplex auto
        - interface Ethernet0/3
        - no ip address
        - shutdown
        - duplex auto
        - interface Serial1/0
        - no ip address
        - shutdown
        - serial restart-delay 0
        - interface Serial1/1
        - no ip address
        - shutdown
        - serial restart-delay 0
        - interface Serial1/2
        - no ip address
        - shutdown
        - serial restart-delay 0
        - interface Serial1/3
        - no ip address
        - shutdown
        - serial restart-delay 0
        - ip forward-protocol nd
        - no ip http server
        - no ip http secure-server
        - ipv6 ioam timestamp
        - control-plane
        - line con 0
        - logging synchronous
        - line aux 0
        - line vty 0 4
        - login
        - transport input none
        - end
        - Router#
      show: []
